<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>แบบสำรวจอวดเมืองโคราช</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one question per screen, sticky progress header + sticky Back/Next footer, centered 560px column */
/* อวดเมืองโคราช KV palette: navy header, orange actions, lime highlight; KV strip only on first & last page */
:root{
  --bg:#f6f5fb; --surface:#ffffff; --ink:#0d1f3d; --muted:#56627a; --line:#dcdcea;
  --navy:#003674; --on-navy:#ffffff; --accent:#003674; --accent-ink:#ffffff; --accent-soft:#ece4fe;
  --cta:#E95429; --cta-ink:#ffffff; --lime:#D3FF34; --teal:#00A79D; --salmon:#FF999A; --lav:#DCB8FE;
  --gold:#E95429; --err:#c62f12;
  --display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071a36; --surface:#0d2549; --ink:#eef1fb; --muted:#a9b5d0; --line:#22406d;
  --navy:#002a5c; --accent:#DCB8FE; --accent-ink:#0d1f3d; --accent-soft:#2a2f63;
  --gold:#ff8a66; --err:#ffab99; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071a36; --surface:#0d2549; --ink:#eef1fb; --muted:#a9b5d0; --line:#22406d;
  --navy:#002a5c; --accent:#DCB8FE; --accent-ink:#0d1f3d; --accent-soft:#2a2f63;
  --gold:#ff8a66; --err:#ffab99; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.app{min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy)}
header::after{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--cta) 0 20%,var(--lime) 20% 40%,var(--teal) 40% 60%,var(--salmon) 60% 80%,var(--lav) 80%)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 8px}
.brand{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.25;min-width:0}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:#c9d3ea}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:#c9d3ea;font:600 13px var(--body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--lime);color:#003674}
.prog{padding-block:0 10px}
.prog .meta{display:flex;justify-content:space-between;font-size:12.5px;color:#c9d3ea;margin-bottom:6px;gap:8px}
.prog .meta b{color:var(--lime);font-weight:600}
.bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);width:0;transition:width .3s}
main{flex:1}
main .wrap{padding-block:22px 28px}
.qno{font-size:13px;color:var(--gold);font-weight:600;letter-spacing:.02em;margin-bottom:4px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(20px,5.4vw,24px);line-height:1.35;margin:0 0 6px;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0 0 16px}
.opts{display:grid;gap:10px}
.grp{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .mk{flex:none;width:22px;height:22px;border:2px solid var(--line);display:grid;place-items:center}
.opt.r .mk{border-radius:50%}.opt.c .mk{border-radius:6px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .mk{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked="true"] .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.opt.c[aria-checked="true"] .mk::after{width:10px;height:6px;border-radius:0;background:none;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,.lang button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sub{margin:-2px 0 2px 34px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-size:15px;color:inherit;cursor:pointer}
.chip[aria-checked="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
label.fl{display:block;font-size:14px;color:var(--muted);margin:4px 0 4px}
input[type=text],input[type=number],textarea{width:100%;box-sizing:border-box;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:130px;resize:vertical}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt{flex-direction:column;gap:4px;padding:12px 4px;text-align:center;justify-content:center}
.scale .n{font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.scale .l{font-size:11.5px;color:var(--muted);line-height:1.25}
.scale .opt[aria-checked="true"] .l{color:var(--ink)}
.intro p{margin:0 0 12px}
.pdpa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14.5px;margin-bottom:14px}
.err{color:var(--err);font-size:14px;margin-top:10px}
footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.frow{display:flex;gap:10px;padding-block:10px}
.btn{flex:1;font:600 16px var(--body);padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{flex:2;background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn[disabled]{opacity:.4;cursor:default}
.done{text-align:center;padding-top:30px}
.kpban{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;line-height:1.5}
.kpban.end{background:transparent;border:1px solid currentColor;color:inherit;opacity:.85;font-weight:500}
.kpgot{font-weight:700;color:var(--accent);margin:12px 0 4px}
a.btn.kpbtn{display:inline-block;max-width:240px;text-decoration:none;margin-top:10px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px;font-size:32px}
details{margin-top:22px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
summary{cursor:pointer;font-weight:600;font-size:14px}
pre{overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-word}
.q{padding-block:20px 6px;border-top:1px solid var(--line);margin-top:14px}
.q .qno{margin-bottom:2px}
h2{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.4;margin:0 0 6px;text-wrap:balance}
.sec{margin-top:22px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--teal);background:var(--accent-soft);color:var(--ink);font-size:14px;font-weight:500}
.q .opts+.grp{margin-top:16px}
.kv{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 18px}
.tags{font-size:13px;font-weight:600;color:#00857c;margin:0 0 10px;letter-spacing:.02em}
.proto{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.dgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px}
.dchip{border:1.5px solid var(--line,#dcd6ee);background:var(--surface,#fff);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;font:inherit;cursor:pointer;color:inherit}
.dchip b{font-size:22px;line-height:1.15}.dchip small{font-size:11.5px;opacity:.75}
.dchip[aria-checked="true"]{background:#003674;color:#fff;border-color:#003674}.dchip[aria-checked="true"] small{opacity:.9}
.dayb{border:1.5px solid var(--line,#dcd6ee);border-radius:16px;padding:12px 14px;margin-top:12px}
.dayh{font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#003674}.dayh span{font-size:12.5px;font-weight:600;background:#D3FF34;color:#003674;border-radius:999px;padding:2px 10px}.dayh span:empty{display:none}
.ven{display:block;font-size:12px;opacity:.65;margin-top:1px}
.dayp{display:grid;grid-template-columns:1fr 110px;gap:4px 10px;align-items:center;margin-top:10px}.dayp .fl{grid-column:1/-1}.dayp .hint{margin:0}
@media (max-width:420px){.dgrid{grid-template-columns:repeat(5,1fr);gap:6px}.dchip b{font-size:19px}}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tags{color:#4fe0d4}:root:not([data-theme="light"]) .dchip[aria-checked="true"]{background:#D3FF34;color:#0b1a33;border-color:#D3FF34}}
:root[data-theme="dark"] .tags{color:#4fe0d4}:root[data-theme="dark"] .dchip[aria-checked="true"]{background:#D3FF34;color:#0b1a33;border-color:#D3FF34}
.sstat{font-weight:600}.sstat.s-ok{color:#1b8552}.sstat.s-fail{color:#c93c3c;text-decoration:underline;cursor:pointer}
@media (prefers-color-scheme: dark){.sstat.s-ok{color:#4cd08f}.sstat.s-fail{color:#ff7b7b}}
.ovhead{margin-bottom:10px}.ovpdpa{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.ovtoc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}.ovtoc a{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:inherit;text-decoration:none}.ovtoc small{opacity:.75}.ovn{font-size:12.5px;font-weight:700;padding:5px 4px}
.ovpart{border-top:3px solid #D34016;margin-top:28px;padding-top:14px;scroll-margin-top:70px}.ovcond{font-size:12.5px;font-weight:600;color:#7a2a10;background:#ffe9e0;border-radius:8px;padding:4px 10px;margin:14px 0 -6px;display:inline-block}
@media (prefers-color-scheme: dark){.ovcond{background:#4a2414;color:#ffc9b3}}
</style>
</head>
<body>

<div class="app">
<header><div class="wrap">
  <div class="hrow">
    <div class="brand" id="brand"></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lth" aria-pressed="true">ไทย</button><button id="len" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="prog"><div class="meta"><span id="partl"></span><b id="cnt"></b></div><div class="bar"><i id="barf"></i></div></div>
</div></header>
<main><div class="wrap" id="stage"></div></main>
<footer id="foot"><div class="wrap frow">
  <button class="btn" id="back"></button><button class="btn pri" id="next"></button>
</div></footer>
</div>

<script>
const T=(th,en)=>({th,en});
const UI={
  brand:T('เทศกาลอวดเมือง โคราช 2569','Awd Mueang Korat 2026'),
  brandsub:T('แบบสำรวจผู้เข้าร่วมงาน · 20–29 พ.ย. 2569','Participant Survey · Nov 20–29, 2026'),
  back:T('ย้อนกลับ','Back'), next:T('ถัดไป','Next'), start:T('เริ่มทำแบบสำรวจ','Start survey'), send:T('ส่งแบบสำรวจ','Submit'),
  of:T('ข้อ','Step'), multi:T('ตอบได้หลายข้อ','Select all that apply'), one:T('เลือก 1 ข้อ','Select 1 option'),
  skipok:T('ข้ามได้ ท่านมีสิทธิ์ปฏิเสธการตอบข้อใดก็ได้','Optional. You may skip any question.'),
  needc:T('กรุณาติ๊กยินยอมก่อนเริ่มทำแบบสำรวจ','Please tick the consent box to start.'),
  specify:T('ระบุ','Please specify'), people:T('จำนวน (คน) รวมผู้ตอบ','Total people (including respondent)'),
  thanks:T('ขอบคุณที่ร่วมตอบแบบสำรวจ','Thank you very much for participating in this survey.'),
  thanks2:T('คำตอบของท่านจะช่วยพัฒนาเทศกาลอวดเมืองโคราชในปีต่อไป','Your answers help us improve Awd Mueang Korat.'),
  raw:T('ดูข้อมูลคำตอบ (สำหรับทีมงาน)','View answer data (for staff)'),
  again:T('เริ่มใหม่','Start again'),
  proto:T('ตัวอย่างทดลอง ยังไม่บันทึกคำตอบเข้าระบบ','Prototype: answers are not saved to any server yet'),
  kpEarn:T('ตอบครบทุกส่วนและกดส่ง รับ 5 แต้ม Korat Point','Complete and submit this survey to get 5 Korat Point'),
  kpEnd:T('หมดช่วงรับแต้ม Korat Point จากแบบสำรวจแล้ว ยังตอบแบบสำรวจได้ตามปกติ','The Korat Point survey reward period has ended. You can still answer the survey.'),
  kpGot:T('ได้รับ 5 แต้ม Korat Point แล้ว','You received 5 Korat Point'),
  kpMy:T('ดูแต้มของฉัน','View my points'),
  kpAlready:T('ท่านทำแบบสำรวจนี้ไปแล้ว','You have already completed this survey'),
  kpAlready2:T('ขอบคุณที่ร่วมตอบแบบสำรวจค่ะ','Thank you for taking part.'),
  kpAnswered:T('ท่านตอบแบบสำรวจนี้ไปแล้ว','You have already answered this survey'),
  sOk:T('บันทึกคำตอบเรียบร้อยแล้ว','Your answers have been saved'),
  sWait:T('กำลังบันทึกคำตอบ…','Saving your answers…'),
  sFail:T('ยังบันทึกไม่สำเร็จ (สัญญาณอินเทอร์เน็ต) แตะเพื่อส่งอีกครั้ง','Not saved yet (connection). Tap to send again'),
  intro:T('ส่วนนำ','Introduction'),
};
const PARTS=[null,
 T('ส่วนที่ 1 ข้อมูลส่วนบุคคลของผู้ตอบ','Part 1: Respondent Demographics'),
 T('ส่วนที่ 2 ข้อมูลการเดินทางและค่าใช้จ่าย','Part 2: Travel and Expenditure Information'),
 T('ส่วนที่ 3 การรับรู้สื่อประชาสัมพันธ์และการมีส่วนร่วม','Part 3: Media Awareness and Engagement'),
 T('ส่วนที่ 4 กิจกรรมและความสนใจในงาน','Part 4: Event Activities and Interests'),
 T('ส่วนที่ 5 ผลกระทบทางธุรกิจและการลงทุน','Part 5: Business and Investment Impact'),
 T('ส่วนที่ 6 ภาพลักษณ์เมือง (City Branding)','Part 6: City Branding Perception'),
 T('ส่วนที่ 7 ความพึงพอใจต่อการจัดงาน','Part 7: Event Satisfaction'),
 T('ส่วนที่ 8 ความตั้งใจในอนาคตและข้อเสนอแนะ','Part 8: Future Intentions and Suggestions')];
const o=(v,th,en,x)=>Object.assign({v,t:T(th,en)},x||{});
const OTHER=(th='อื่น ๆ',en='Other')=>o('other',th,en,{text:true});
const RL5=[T('น้อยที่สุด','Least'),T('น้อย','Low'),T('ปานกลาง','Fair'),T('มาก','Good'),T('มากที่สุด','Excellent')];
const EXP=['500-900','1,000-1,400','1,500-1,900','2,000-3,000'];
const expOpts=(extra)=>[...(extra?[o('100-400','100-400 บาท','100–400 THB')]:[]),...EXP.map(r=>o(r,r+' บาท',r.replace('-','–')+' THB')),o('>3000','มากกว่า 3,000 บาท','More than 3,000 THB')];
const SCALE_TH6=T('ระดับความคิดเห็นต่อโคราช (1 = น้อยที่สุด ถึง 5 = มากที่สุด)','Please rate your level of agreement regarding Korat’s image (1 = Strongly Disagree / Least to 5 = Strongly Agree / Most)');
const SCALE_TH7=T('1 = น้อยที่สุด, 2 = น้อย, 3 = ปานกลาง, 4 = มาก, 5 = มากที่สุด','Please rate your satisfaction with each aspect of the event (1 = Very Dissatisfied / Least to 5 = Very Satisfied / Most)');
const FEST=['festival','kbattle','sounder','kbatx'];

const S=[
 {id:'consent',type:'intro',part:0},
 // Part 1
 {id:'p1_1',part:1,no:'1',type:'single',q:T('ประเภทผู้ตอบแบบสอบถาม','Respondent Category'),opts:[
  o('thai','นักท่องเที่ยว/ผู้เข้าชมงานชาวไทย','Thai Tourist / Visitor'),o('foreign','นักท่องเที่ยวต่างชาติ','International Tourist'),
  o('biz','ผู้ประกอบการ/นักลงทุน','Entrepreneur / Investor'),o('partner','ภาคีเครือข่าย/หน่วยงาน','Network Partner / Government Agency'),
  o('media','สื่อมวลชน/อินฟลูเอนเซอร์','Media / Influencer')]},
 {id:'p1_2',part:1,no:'2',type:'single',q:T('ที่อยู่ปัจจุบัน','Current Residence'),opts:[
  o('korat','จังหวัดนครราชสีมา','Nakhon Ratchasima Province'),
  o('other_prov','จังหวัดอื่นในประเทศไทย','Other Province in Thailand',{fields:[['province',T('ระบุจังหวัด','Please specify')]]}),
  o('abroad','ต่างประเทศ','Outside Thailand',{fields:[['nationality',T('สัญชาติ','Nationality')],['country',T('ประเทศถิ่นพำนัก','Country of Residence')]]})]},
 {id:'p1_3',part:1,no:'3',type:'single',q:T('เพศ','Gender'),opts:[o('m','ชาย','Male'),o('f','หญิง','Female'),o('lgbt','LGBTQIA+','LGBTQIA+'),o('na','ไม่ประสงค์ระบุ','Prefer not to say')]},
 {id:'p1_4',part:1,no:'4',type:'number',q:T('อายุ','Age'),unit:T('ปี','years')},
 {id:'p1_5',part:1,no:'5',type:'single',q:T('สถานภาพสมรส','Marital Status'),opts:[o('single','โสด','Single'),o('married','สมรส','Married'),OTHER()]},
 {id:'p1_6',part:1,no:'6',type:'single',q:T('อาชีพ','Occupation'),opts:[
  o('gov','ข้าราชการ/พนักงานรัฐ/รัฐวิสาหกิจ','Government Official / Civil Servant / State Enterprise Employee'),o('private','พนักงานเอกชน','Private Company Employee'),
  o('own','ธุรกิจส่วนตัว','Business Owner / Self-Employed'),o('student','นักเรียน/นักศึกษา','Student'),o('retired','เกษียณ','Retired'),OTHER()]},
 {id:'p1_7',part:1,no:'7',type:'single',q:T('การศึกษา','Highest Level of Education'),opts:[
  o('below','ต่ำกว่าปริญญาตรี','Below Bachelor’s Degree'),o('ba','ปริญญาตรี','Bachelor’s Degree'),o('ma','ปริญญาโท','Master’s Degree'),o('phd','ปริญญาเอก','Doctoral Degree'),OTHER()]},

if(UID)A._uid=UID;

let LIFFOK=false, KPS='', KPV='';
const withTO=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
function loadLiff(){return new Promise(res=>{if(window.liff)return res(window.liff);const sc=document.createElement('script');sc.src='https://static.line-scdn.net/liff/edge/2/sdk.js';sc.onload=()=>res(window.liff||null);sc.onerror=()=>res(null);document.head.appendChild(sc);});}
function idTok(){try{return LIFFOK&&window.liff?(window.liff.getIDToken()||''):'';}catch(e){return '';}}
async function initKP(){
  try{const lf=await withTO(loadLiff(),6000);if(!lf)return;
    await withTO(lf.init({liffId:LIFF_ID}),6000);
    if(!lf.isLoggedIn())return;
    LIFFOK=true;const tk=idTok();if(!tk)return;
    const r=await withTO(fetch(SURVEY_API+'/kp/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:tk})}),8000);
    const j=await r.json().catch(()=>({}));const k=j.kp||{};
    const member=k.member===true||k.status==='member';
    if(A._sent&&!j.answered){A={};i=0;SUB='';save();}
    else if(A._sent&&PAGES[i]===9){render();return;}
    if(k.status==='already'){KPV='already';}
    else if(j.answered&&!(k.status==='ok'&&member)){KPV='answered';}
    else if(k.status==='ok'&&member){KPS='earn';}
    else if(k.status==='ended'){KPS='end';}
    render();
  }catch(e){}
}
async function submit(){return;if(SUB==='wait')return;SUB='wait';render();
  if(!A._sid)A._sid=newSid();save();
  try{const r=await fetch(SURVEY_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({sid:A._sid,uid:UID||'',form:FORM,lang:L,test:TEST,answers:A},idTok()?{idToken:idTok()}:{}))});
    const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error('x');SUB='ok';A._sent=new Date().toISOString();
    const ks=(j.kp&&j.kp.status)||'';A._kp=ks;
    if(ks==='not_member'&&LIFFOK){save();if(PAGES[i]===9)render();setTimeout(()=>{try{window.liff.closeWindow();}catch(e){}},1500);return;}}
  catch(e){SUB='fail';}
  save();if(PAGES[i]===9)render();}

function fieldHTML(path,f,val){
  const [k,lab,typ]=f; const v=(val||{})[k]??'';
  const label=lab?tx(lab):tx(UI.people);
  return `<div><label class="fl" for="f_${path}_${k}">${esc(label)}</label><input id="f_${path}_${k}" data-path="${path}" data-k="${k}" type="${typ==='number'?'number':'text'}" ${typ==='number'?'inputmode="numeric" min="0"':''} value="${esc(v)}"></div>`;
}
function optHTML(s,opt,checked,kind,cur){
  let h=`<button type="button" class="opt ${kind}" role="${kind==='r'?'radio':'checkbox'}" aria-checked="${checked}" data-v="${opt.v}"><span class="mk"></span><span>${esc(tx(opt.t))}</span></button>`;
  if(checked){
    const sub=[];
    if(opt.text) sub.push(fieldHTML(opt.v,['text',UI.specify],cur));
    (opt.fields||[]).forEach(f=>sub.push(fieldHTML(opt.v,f,cur)));
    const sq=opt.subq||opt.subm;
    if(sq){
      const multi=!!opt.subm; const sv=(cur||{})[sq.key]; 
      sub.push(`<div class="chips" data-sub="${sq.key}" data-multi="${multi}">${sq.opts.map(x=>{const on=multi?(sv||[]).includes(x.v):sv===x.v;return `<button type="button" class="chip" role="${multi?'checkbox':'radio'}" aria-checked="${on}" data-sv="${x.v}">${esc(tx(x.t))}</button>`}).join('')}</div>`);
      const ov=multi?(sv||[]).includes('other'):sv==='other';
      if(ov) sub.push(fieldHTML(opt.v,[sq.key+'_other',UI.specify],cur));
    }
    if(sub.length) h+=`<div class="sub">${sub.join('')}</div>`;
  }
  return h;

      <div class="dayp"><label class="fl" for="pp_${d}">${L==='th'?'วันนี้กลุ่มของท่านมากี่คน (รวมตัวท่าน)':'How many in your group came today (including you)?'}</label>
       <input id="pp_${d}" type="number" inputmode="numeric" min="1" data-pp="${d}" value="${esc(ppl)}">
       ${ps?`<span class="hint">${L==='th'?'จากข้อ 2.7: '+ps+' คน':'From Q2.7: '+ps}</span>`:''}</div>
      ${acts.length&&(+ppl>1)?`<div class="fl" style="margin-top:10px">${L==='th'?'วันนี้ทั้งกลุ่มไปด้วยกันทุกกิจกรรม หรือแยกกันไป':'Did your group do every activity together today?'}</div><div class="chips" style="margin-top:4px"><button type="button" class="chip" role="radio" aria-checked="${full}" data-full="1">${L==='th'?'ทั้งกลุ่มไปด้วยกันทุกกิจกรรม':'The whole group joined every activity together'}</button><button type="button" class="chip" role="radio" aria-checked="${!full}" data-full="0">${L==='th'?'แยกกันไปบางกิจกรรม':'We split up for some activities'}</button></div>
       ${!full?`<div class="sub">${acts.map(k=>`<div><label class="fl" for="pa_${d}_${k}">${esc(L==='th'?ACT[k][0]:ACT[k][1])} · ${L==='th'?'มีกี่คนในกลุ่มที่ไปกิจกรรมนี้':'how many in your group joined this'}</label><input id="pa_${d}_${k}" type="number" inputmode="numeric" min="1" max="${esc(ppl)}" data-pa="${k}" value="${esc((x.pa||{})[k]??ppl)}"></div>`).join('')}</div>`:''}`:''}
      </div>`;}).join('');
  } else if(s.type==='rate'){
    const labs=s.labels||RL5;
    h+=`<div class="scale" role="radiogroup">${labs.map((lb,k)=>`<button type="button" class="opt r" role="radio" aria-checked="${a?.v===k+1}" data-rate="${k+1}"><span class="n">${k+1}</span><span class="l">${esc(tx(lb))}</span></button>`).join('')}</div>`;
  } else if(s.type==='number'){
    h+=`<div style="display:flex;align-items:center;gap:10px;max-width:220px"><input id="f_${s.id}" data-main="1" type="number" inputmode="numeric" min="1" max="120" value="${esc(a?.v??'')}" aria-label="${esc(tx(s.q))}"><span>${esc(tx(s.unit))}</span></div>`;
  } else if(s.type==='text'){
    h+=`<textarea id="f_${s.id}" data-main="1" aria-label="${esc(tx(s.q))}">${esc(a?.v??'')}</textarea>`;
  } else if(s.type==='fields'){
    h+=`<div class="opts">${s.fields.map(f=>fieldHTML(s.id,f,a)).join('')}</div>`;
    if(s.sumTo) h+=`<p class="hint" id="sum_${s.id}" style="margin-top:8px">${sumTxt(s)}</p>`;
  } else if(s.type==='contact'){
    h+=`<div class="opts"><input id="f_${s.id}" data-main="1" type="text" value="${esc(a?.v??'')}" aria-label="${esc(tx(s.q))}">
      <button type="button" class="opt c" role="checkbox" aria-checked="${!!a?.ok}" data-okc="1"><span class="mk"></span><span>${L==='th'?'ยินยอมให้ติดต่อ':'I consent to be contacted'}</span></button></div>`;
  }
  return h+'</section>';
}

function render(){
  document.documentElement.lang=L;
  $('lth').setAttribute('aria-pressed',L==='th');$('len').setAttribute('aria-pressed',L==='en');
  $('brand').innerHTML=`${esc(tx(UI.brand))}<small>${esc(tx(UI.brandsub))}</small>`;
  if(i<0)i=0; if(i>=PAGES.length)i=PAGES.length-1;
  const part=PAGES[i];
  $('partl').textContent=part===0?tx(UI.intro):part===9?'':(L==='th'?'ส่วนที่ ':'Part ')+part+(L==='th'?' จาก 8':' of 8');
  $('cnt').textContent=part>=1&&part<=8?`${part}/8`:'';
  $('barf').style.width=(part===9?100:part/8*100)+'%';
  $('back').textContent=tx(UI.back); $('back').disabled=i===0; $('foot').hidden=part===9;
  $('next').textContent=part===0?tx(UI.start):(part===8?tx(UI.send):(L==='th'?'ถัดไป ส่วนที่ '+(part+1):'Next: Part '+(part+1)));
  let h='';
  if(OV){
    $('foot').hidden=true;$('partl').textContent=L==='th'?'ภาพรวมทุกคำถาม':'All questions';$('cnt').textContent='';$('barf').style.width='100%';
    const CN={p2_stay:T('ถามเฉพาะผู้ที่มาเป็นกลุ่ม (ข้อ 2.7 มากกว่า 1 คน) และไม่ได้ตอบข้อ 2.4 ว่าอยู่โคราช','Shown only for groups (more than 1 person in Q2.7) not living in Korat'),p2_go:T('ถามเฉพาะผู้ที่มาเป็นกลุ่ม (ข้อ 2.7 มากกว่า 1 คน) และไม่ได้ตอบข้อ 2.6 ว่าอยู่โคราช','Shown only for groups (more than 1 person in Q2.7) not living in Korat'),p2_2:T('ถามเฉพาะเมื่อข้อ 2.1 ตอบว่ามาเข้าร่วมเทศกาล','Shown only when Q2.1 is Awd Mueang Korat'),p2_why:T('ถามเฉพาะเมื่อข้อ 2.1 ตอบว่ามาด้วยเหตุผลอื่น','Shown only when Q2.1 is another reason'),p2_5:T('ถามเฉพาะผู้ที่พักค้างคืน (ข้อ 2.4 ไม่ใช่ไป-กลับหรือคนโคราช)','Shown only to overnight visitors'),p2_8_1:T('ถามเฉพาะผู้ที่พักค้างคืน','Shown only to overnight visitors'),p3_kpwhy:T('ถามเฉพาะผู้ตอบข้อ 3.5 ว่าเช็กอินบางจุดหรือไม่ได้เช็กอิน','Shown only if not checked in everywhere'),p4_main:T('ถามเฉพาะผู้ที่เลือกวันที่ 24 พ.ย. ในข้อ 2.3','Shown only if 24 Nov is selected in Q2.3'),p4_other:T('ถามเฉพาะผู้ที่มีเหตุผลหลักในข้อ 4.3','Shown only if a main reason is chosen in Q4.3'),p3_kbsrc:T('ถามเฉพาะผู้ตอบข้อ 3.7.1 ว่ารู้จัก K-BATTLE · ตอบข้อเดียว · ตัวเลือกสลับลำดับให้แต่ละคน','Shown only if the respondent knows K-BATTLE · one answer · options shuffled per respondent'),p5_2:T('ไม่ถามผู้ที่อยู่จังหวัดนครราชสีมา (ข้อ 1.2)','Not shown to Korat residents')};
    let n=0;const toc=[];
    h=`<div class="ovhead"><h1>${L==='th'?'แบบสำรวจผู้เข้าร่วมงาน (ฟอร์มรายวัน) · ทุกคำถามในหน้าเดียว':'Participant survey (daily form) · all questions'}</h1><p class="hint">${L==='th'?'หน้านี้ไว้ดูภาพรวมเพื่อแก้/เพิ่มคำถามเท่านั้น ไม่บันทึกคำตอบ · ข้อที่มีเงื่อนไขแสดงไว้ทั้งหมด':'Overview for editing only. Answers are not saved.'}</p>
      <div class="ovpdpa"><b>${L==='th'?'ส่วนนำ · ความยินยอม PDPA':'Introduction · PDPA consent'}</b> ${L==='th'?'(1) ข้าพเจ้ายินยอมให้เก็บและใช้ข้อมูลตามวัตถุประสงค์ (บังคับ) · (2) กรณีอายุต่ำกว่า 20 ปี ผู้ปกครองให้ความยินยอมแล้ว':'(1) Consent (required) · (2) Guardian consent if under 20'}</div><div class="ovtoc" id="ovtoc"></div></div>`;
    for(let p=1;p<=8;p++){const qs=S.filter(x=>x.part===p);n+=qs.length;toc.push(`<a href="#ovp${p}">${p}. ${esc(tx(PARTS[p]).replace(/^(ส่วนที่ \d+ |Part \d+: )/,''))} <small>${qs.length} ข้อ</small></a>`);
      h+=`<section class="ovpart" id="ovp${p}"><div class="qno">${L==='th'?'ส่วนที่ '+p:'Part '+p}</div><h1>${esc(tx(PARTS[p]).replace(/^(ส่วนที่ \d+ |Part \d+: )/,''))}</h1>`+qs.map((x,k)=>(CN[x.id]?`<div class="ovcond">⤷ ${esc(tx(CN[x.id]))}</div>`:'')+qHTML(x,qs[k-1])).join('')+`</section>`;}
    $('stage').innerHTML=h;$('ovtoc').innerHTML=toc.join('')+`<span class="ovn">${L==='th'?'รวม':'Total'} ${n} ${L==='th'?'ข้อ':'items'}</span>`;
    $('stage').querySelectorAll('section[data-q]').forEach(el=>bindQ(S.find(x=>x.id===el.dataset.q),el));save();return;
  }
  if(KPV){$('foot').hidden=true;$('partl').textContent='';$('cnt').textContent='';
    $('stage').innerHTML=`<div class="done">${KVIMG}<div class="ok">✓</div><h1>${esc(tx(KPV==='already'?UI.kpAlready:UI.kpAnswered))}</h1><p class="hint">${esc(tx(UI.kpAlready2))}</p>${KPV==='already'?`<a class="btn kpbtn" href="${KP_POINTS}">${esc(tx(UI.kpMy))}</a>`:''}</div>`;return;}
  if(part===0){
    const c=A.consent||{};
    h=`<div class="intro">${KVIMG}${KPS==='earn'?`<div class="kpban">★ ${esc(tx(UI.kpEarn))}</div>`:KPS==='end'?`<div class="kpban end">${esc(tx(UI.kpEnd))}</div>`:''}<p class="tags">#น่าลงทุน #น่าเที่ยว #น่าอยู่</p><div class="qno">${L==='th'?'แบบสำรวจผู้เข้าร่วมงาน':'Participant Survey'}</div>
    <h1>${L==='th'?'“เทศกาลอวดเมือง โคราช 2569”':'“Awd Mueang Korat Festival 2026”'}</h1>
    <p class="hint">${L==='th'?'กิจกรรมการสนับสนุนด้านประชาสัมพันธ์ในการพัฒนาและการยกระดับจังหวัดนำร่องอวดเมืองอันดับที่ 1 - จังหวัดนครราชสีมา<br>ระหว่างวันที่ 20-29 พฤศจิกายน 2569 ณ จังหวัดนครราชสีมา'
      :'Activity: Public Relations Support for Developing and Upgrading the #1 Pilot City Showcase Province – Nakhon Ratchasima<br>Date: November 20–29, 2026 | Venue: Nakhon Ratchasima Province'}</p>
    <div class="pdpa">${L==='th'?'ข้อมูลที่ได้จะใช้เพื่อวิเคราะห์ผลกระทบทางเศรษฐกิจและวางแผนพัฒนาเทศกาลเท่านั้น และจะไม่เปิดเผยข้อมูลส่วนบุคคล ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA) ท่านมีสิทธิ์ปฏิเสธการตอบข้อใดก็ได้'
      :'<b>Privacy Notice &amp; Consent:</b> The information collected will be used solely for economic impact analysis and festival development planning. Personal data will remain strictly confidential in accordance with the Personal Data Protection Act B.E. 2562 (2019) (PDPA). You have the right to decline answering any question.'}</div>
    <div class="opts">
     <button type="button" class="opt c" role="checkbox" aria-checked="${!!c.agree}" data-cons="agree"><span class="mk"></span><span>${L==='th'?'ข้าพเจ้ายินยอมให้เก็บและใช้ข้อมูลตามวัตถุประสงค์ข้างต้น':'I consent to the collection and use of my data for the purposes stated above.'}</span></button>
     <button type="button" class="opt c" role="checkbox" aria-checked="${!!c.guardian}" data-cons="guardian"><span class="mk"></span><span>${L==='th'?'(กรณีผู้ตอบอายุต่ำกว่า 20 ปี) ผู้ปกครองให้ความยินยอมแล้ว':'(For respondents under 20 years of age) Parental/guardian consent has been obtained.'}</span></button>
    </div>${err?`<div class="err" role="alert">${esc(err)}</div>`:''}</div>`;
  } else if(part===9){
    h=`<div class="done">${KVIMG}<div class="ok">✓</div><h1>${esc(tx(UI.thanks))}</h1><p class="hint">${esc(tx(UI.thanks2))}</p>
      ${A._kp==='credited'?`<p class="kpgot">★ ${esc(tx(UI.kpGot))}</p><a class="btn kpbtn" href="${KP_POINTS}">${esc(tx(UI.kpMy))}</a>`:LIFFOK?'':`<button class="btn" id="again" style="max-width:220px">${esc(tx(UI.again))}</button>`}
      
      <p class="proto sstat s-${SUB||'wait'}" id="sstat">${SUB==='ok'?'✓ '+esc(tx(UI.sOk)):SUB==='fail'?esc(tx(UI.sFail)):esc(tx(UI.sWait))}</p></div>`;
  } else {
    const qs=visible().filter(x=>x.part===part);
    h=`<div class="qno">${L==='th'?'ส่วนที่ '+part:'Part '+part}</div><h1>${esc(tx(PARTS[part]).replace(/^(ส่วนที่ \d+ |Part \d+: )/,''))}</h1>
       <p class="hint">${esc(tx(UI.skipok))}</p>`;
    h+=qs.map((s,k)=>qHTML(s,qs[k-1])).join('');
  }
  $('stage').innerHTML=h;
  $('stage').querySelectorAll('[data-cons]').forEach(b=>b.onclick=()=>{A.consent=A.consent||{};const k=b.dataset.cons;A.consent[k]=!A.consent[k];err='';render();});
  $('stage').querySelectorAll('section[data-q]').forEach(el=>bindQ(S.find(x=>x.id===el.dataset.q),el));
  const ag=$('again'); if(ag) ag.onclick=()=>{A=UID?{_uid:UID}:{};i=0;SUB='';render();window.scrollTo(0,0);};
  const ss=$('sstat'); if(ss&&SUB==='fail') ss.onclick=submit;
  save();
}
function rerender(){const y=window.scrollY;if(!OV)S.forEach(x=>{if(x.show&&!x.show(A))delete A[x.id];});render();window.scrollTo(0,y);}
function bindQ(s,st){
  if(s.type==='single'||s.type==='chips'||s.type==='nights'){
    st.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v; const prev=A[s.id];
      A[s.id]=prev&&prev.v===v?prev:{v}; rerender();
    });
  }
  if(s.type==='multi'){
    const all=s.groups.flatMap(g=>g[1]);
    st.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v; const cur=A[s.id]||{v:[]}; let sel=cur.v.slice(); const op=all.find(x=>x.v===v);
      if(sel.includes(v)) sel=sel.filter(x=>x!==v); else { if(op.excl) sel=[v]; else sel=sel.filter(x=>!all.find(y=>y.v===x)?.excl).concat(v); }
      cur.v=sel; A[s.id]=cur; rerender();
    });
  }
  if(s.type==='dates') st.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const cur=A[s.id]||{v:[]};const d=b.dataset.d;cur.v=cur.v.includes(d)?cur.v.filter(x=>x!==d):cur.v.concat(d).sort();A[s.id]=cur;
    if(A.p4_1&&A.p4_1.days){Object.keys(A.p4_1.days).forEach(k=>{if(!cur.v.includes(k))delete A.p4_1.days[k];});syncDaily();}rerender();});
  if(s.type==='daily') st.querySelectorAll('[data-day]').forEach(box=>{const d=box.dataset.day, cur=()=>{A.p4_1=A.p4_1||{v:[],days:{}};A.p4_1.days=A.p4_1.days||{};return A.p4_1.days[d]=A.p4_1.days[d]||{a:[],p:partySize(A)||undefined,full:true};};
    box.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const x=cur(),k=b.dataset.act;x.a=x.a.includes(k)?x.a.filter(y=>y!==k):x.a.concat(k);syncDaily();rerender();});
    box.querySelectorAll('[data-pp]').forEach(inp=>inp.onchange=()=>{const x=cur();x.p=+inp.value||undefined;syncDaily();rerender();});
    box.querySelectorAll('[data-full]').forEach(b=>b.onclick=()=>{const x=cur();x.full=b.dataset.full==='1';if(x.full)delete x.pa;syncDaily();rerender();});
    box.querySelectorAll('[data-pa]').forEach(inp=>inp.oninput=()=>{const x=cur();x.pa=x.pa||{};x.pa[inp.dataset.pa]=Math.min(+inp.value||0,x.p||99);syncDaily();save();});});
  if(s.type==='rate') st.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{A[s.id]={v:+b.dataset.rate};rerender();});
  st.querySelectorAll('[data-sub]').forEach(box=>box.querySelectorAll('[data-sv]').forEach(c=>c.onclick=()=>{
    const k=box.dataset.sub, multi=box.dataset.multi==='true', cur=A[s.id];
    if(multi){const arr=cur[k]||[];cur[k]=arr.includes(c.dataset.sv)?arr.filter(x=>x!==c.dataset.sv):arr.concat(c.dataset.sv);} else cur[k]=c.dataset.sv;
    rerender();
  }));
  st.querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=()=>{const cur=A[s.id]||(A[s.id]={});cur[inp.dataset.k]=inp.value;save();const sm=document.getElementById('sum_'+s.id);if(sm&&s.sumTo)sm.textContent=sumTxt(s);});
  st.querySelectorAll('[data-main]').forEach(inp=>inp.oninput=()=>{const cur=A[s.id]||(A[s.id]={});cur.v=inp.value;save();});
  st.querySelectorAll('[data-okc]').forEach(b=>b.onclick=()=>{const cur=A[s.id]||(A[s.id]={});cur.ok=!cur.ok;rerender();});
}
function syncDaily(){const p=A.p4_1;if(!p)return;const days=p.days||{};let vis=0;const u=new Set();
  Object.entries(days).forEach(([d,x])=>{(x.a||[]).forEach(k=>{u.add(k);const n=x.full===false&&x.pa&&x.pa[k]!=null?x.pa[k]:(x.p||partySize(A)||1);vis+=n;});});
  p.v=[...u]; p.cats=[...new Set(p.v.map(k=>ACT[k][2]))]; p.visitation=vis; save();}
function go(){
  if(PAGES[i]===0&&!(A.consent&&A.consent.agree)){err=tx(UI.needc);render();return;}
  if(i<PAGES.length-1){i++;if(PAGES[i]===9){A._submitted=new Date().toISOString();A._sid=A._sid||newSid();SUB='';render();window.scrollTo(0,0);submit();return;}render();window.scrollTo(0,0);}
}
$('next').onclick=go;
$('back').onclick=()=>{if(i>0){i--;render();window.scrollTo(0,0);}};
$('lth').onclick=()=>{L='th';err='';rerender();};$('len').onclick=()=>{L='en';err='';rerender();};
render();
if(PAGES[i]===9&&!A._sent&&A.consent&&A.consent.agree)submit();

</script>
