<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Kanit;background:#8cabd9;width:390px;padding:18px 14px 30px}
.chat{font-size:12px;color:#fff;text-align:center;margin-bottom:10px}
.fx{background:#fff;border-radius:18px;overflow:hidden;width:320px}
.top{background:#003674;color:#fff;padding:14px 16px}.top small{color:#D3FF34;font-size:12px;font-weight:600}.top h2{font-size:19px;line-height:1.2}
.bd{padding:14px 16px;color:#003674;font-size:14px;line-height:1.7}
.qr{width:170px;height:170px;margin:6px auto 4px;background:
repeating-linear-gradient(90deg,#003674 0 10px,#fff 10px 17px),#003674;-webkit-mask:repeating-linear-gradient(0deg,#000 0 9px,transparent 9px 14px);border-radius:6px}
.code{text-align:center;font-weight:700;font-size:20px;letter-spacing:3px}
.tag{display:inline-block;background:#E95429;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin-right:4px}
.d{display:flex;gap:6px;margin:6px 0}.d span{flex:1;text-align:center;border-radius:10px;padding:6px 0;font-weight:600;background:#EEF3FB;border:1.5px solid #003674}
.b{margin:10px 16px 16px;text-align:center;background:#00A79D;color:#fff;border-radius:12px;padding:11px;font-weight:700}
</style></head><body>
<div class="chat">LINE อวดเมืองโคราช</div>
<div class="fx"><div class="top"><small>ลงทะเบียนสำเร็จ ✓</small><h2>บัตรสื่อมวลชน<br>อวดเมือง.โคราช × K-BATTLE</h2></div>
<div class="bd"><b>คุณสมชาย ใจดี</b><br><span class="tag">สื่อมวลชน</span>ไทยรัฐออนไลน์ · ผู้สื่อข่าว
<div class="d"><span>ส. 21 พ.ย.</span><span>อา. 22 พ.ย.</span></div>
<img src="qr.svg" style="display:block;width:170px;height:170px;margin:6px auto 4px"><div class="code">PR-4827</div>
<div style="font-size:12px;color:#5b6b85;text-align:center">แสดง QR นี้ที่จุดเช็กอินสื่อ ลานย่าโม ใช้ได้ทั้ง 2 วัน</div></div>
<div class="b">ดูกำหนดการ &amp; แผนที่</div></div>
</body></html>
