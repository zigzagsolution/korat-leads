<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#003674; --orange:#E95429; --lime:#D3FF34;
  --ground:#002857; --panel:#003674; --line:rgba(255,255,255,.14);
  --ink:#fff; --mute:rgba(255,255,255,.7); --faint:rgba(255,255,255,.42);
  --display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Kanit",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--lime)}
.band{background:var(--orange);color:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.band .wrap{padding-top:22px;padding-bottom:20px}
.band small{font-family:var(--display);font-weight:500;letter-spacing:.04em}
.band h1{margin:2px 0 6px;font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,48px);line-height:1.05}
.band p{margin:0;font-size:15px;max-width:60ch}
.band nav{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.band nav a{font-family:var(--display);font-weight:500;color:var(--navy);text-decoration:none;background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:14px}
.chip[aria-pressed="true"]{background:#fff;color:var(--navy);border-color:#fff}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.f{background:var(--orange)}.dot.d{background:var(--lime)}
.legend{margin-left:auto;color:var(--mute);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding-bottom:24px}
.mapbox{position:relative}#map{display:block;width:100%;height:72vh;min-height:420px;border:0;border-radius:14px;background:#dfe6ee}
.full{position:absolute;right:10px;bottom:28px;background:var(--navy);color:#fff;text-decoration:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
a.item{text-decoration:none}
.list{background:var(--panel);border-radius:14px;max-height:72vh;overflow:auto}
.list h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;padding:12px 14px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:1;display:flex;align-items:center;gap:8px}
.list h2 span{color:var(--mute);font-weight:500;font-size:13px;margin-left:auto}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit}
.item:hover,.item:focus-visible{background:rgba(255,255,255,.07);outline:none}
.num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px}
.num.f{background:var(--orange);color:#fff}.num.d{background:var(--lime);color:var(--navy)}
.num.x{background:transparent;border:1.5px dashed var(--faint);color:var(--faint)}
.item b{font-weight:600;display:block}
.item small{color:var(--mute);display:block;font-size:12.5px;line-height:1.4}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:0 6px;margin-top:3px;font-weight:600}
.tag.branch{background:#FFE08A;color:#4a3500}.tag.check{background:#FFB199;color:#5a1600}.tag.none{background:rgba(255,255,255,.16);color:#fff}
.pinx{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);font-family:var(--display);font-weight:700;font-size:12px}
.pin.f{background:var(--orange)}.pin.f span{color:#fff}
.pin.d{background:var(--lime)}.pin.d span{color:var(--navy)}
.pin.warn{border-color:#FFD23F;border-style:dashed}
.home{width:34px;height:34px;border-radius:50%;background:var(--navy);border:3px solid #fff;display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.leaflet-popup-content{font-family:var(--body);font-size:14px;margin:12px 14px;color:#10223d}
.pp b{font-family:var(--display);font-size:16px;display:block;line-height:1.25}
.pp .k{font-size:12px;color:#5a6b80}
.pp .nt{background:#FFF4D6;border-radius:6px;padding:4px 8px;margin-top:6px;font-size:12.5px}
.pp a.go{display:inline-block;margin-top:8px;background:var(--navy);color:#fff;text-decoration:none;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.note{color:var(--mute);font-size:13px;padding:0 0 18px}
footer{border-top:1px solid var(--line);padding:16px 0 28px;color:var(--faint);font-size:13px;text-align:center}
@media (max-width:860px){.grid{grid-template-columns:1fr}#map{height:58vh;min-height:360px}.list{max-height:none}.legend{margin-left:0}}
</style>
</head>

<script>
const S=JSON.parse(document.getElementById('data').textContent);
const GN={f:'ร้านอาหาร',d:'ร้านนม ของหวาน เครื่องดื่ม'};
const TAG={branch:'มีหลายสาขา',check:'ควรเช็ก',none:'ยังหาไม่เจอ'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur='all';
function render(){
  const el=document.getElementById('list'); el.innerHTML='';
  ['f','d'].filter(g=>cur==='all'||cur===g).forEach(g=>{
    const arr=S.filter(s=>s.g===g), pinned=arr.filter(s=>s.lat!=null).length;
    el.insertAdjacentHTML('beforeend',`<h2><i class="dot ${g}"></i>${GN[g]}<span>ปักหมุด ${pinned}/${arr.length}</span></h2>`);
    arr.forEach(s=>{
      const inner=`<span class="num ${s.lat==null?'x':g}">${s.i}</span><span><b>${esc(s.n)}</b>`+
        `<small>${s.lat==null?esc(s.note):esc(s.a)+(s.note?' · '+esc(s.note):'')}</small>`+(s.s!=='ok'?`<span class="tag ${s.s}">${TAG[s.s]}</span>`:'')+`</span>`;
      el.insertAdjacentHTML('beforeend', s.u?`<a class="item" href="${esc(s.u)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="item">${inner}</div>`);
    });
  });
}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{cur=c.dataset.g;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render();});
const tot=S.length, pin=S.filter(s=>s.lat!=null).length;
document.getElementById('sum').textContent=`ปักหมุดได้ ${pin} จาก ${tot} ร้าน · ตำแหน่งค้นจากแผนที่ออนไลน์ วันที่ 14 พ.ย. 2569 ร้านที่มีป้าย "มีหลายสาขา" หรือ "ควรเช็ก" ควรยืนยันกับร้านอีกครั้ง`;
render();
</script>
